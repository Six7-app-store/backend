name: Backend CI/CD

on:
  # main ist Produktion, develop wird Staging (deployment #27, ADR 0013).
  # Beide bauen und pushen ihr Image; PRs gegen beide werden geprueft.
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]
  # Von Hand auslösbar. Ohne diesen Trigger lässt sich die Pipeline nur
  # durch einen Commit starten — für eine Vorführung oder nach einem
  # behobenen Infrastrukturproblem ist das unnötig umständlich.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ================================================================
  # 🔍 LINT
  # ================================================================
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Run Ruff
        run: poetry run ruff check .

  # ================================================================
  # 🧪 TEST (unit) — no external dependencies
  # ================================================================
  test-unit:
    name: "🧪 Test (unit)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Run unit tests
        run: poetry run pytest -m unit -v
        env:
          # ``DATABASE_URL`` muss gesetzt sein, weil ``app.config.Settings``
          # es als Pflichtfeld deklariert — ohne wäre der App-Import in
          # den Tests schon ein ValidationError. Ein separates
          # ``TEST_DATABASE_URL`` brauchen wir hier nicht: der Conftest
          # fällt auf ``settings.DATABASE_URL`` zurück, und auf dem
          # Runner-VM gibt es ohnehin nur diese eine DB. Lokal ist die
          # Trennung wichtig (Dev-DB vs. Wegwerf-Test-DB); in CI nicht.
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          # Lifespan-startup spawns a Celery event-listener + a
          # reconciler asyncio task on every ``TestClient(app)``
          # construct. Across hundreds of test-client contexts those
          # daemons stack up, hold DB + broker connections, and
          # eventually exhaust the SQLAlchemy pool / block on broker
          # reads. This flag short-circuits the lifespan body in
          # tests — production paths set neither var.
          DISABLE_BACKGROUND_TASKS: "1"
          CREDENTIAL_ENCRYPTION_KEY: "Q1PNlFd4It9oQPtjCcXcmB7wGDkY4w8KwpIRNSF4u7U="
          KEYCLOAK_SERVER_URL: "http://localhost:8080"
          KEYCLOAK_REALM: "dhbw"
          KEYCLOAK_CLIENT_ID: "appstore-backend"
          KEYCLOAK_CLIENT_SECRET: "test-secret"
          KEYCLOAK_ENABLED: "false"
          # Suffix the .coverage file so it can be merged in the
          # ``coverage`` job alongside the integration job data.
          COVERAGE_FILE: .coverage.unit

      - name: Upload coverage data (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  # ================================================================
  # 🧪 TEST (integration) — requires Postgres
  # ================================================================
  # Covers every test that is not a unit test. ``tests/conftest.py`` gives each
  # test without an explicit marker the lane of its directory (``tests/unit/``
  # is ``unit``, everything else ``integration``), so no test can fall between
  # the two lanes; ``tests/test_phase1_correctness.py`` checks that. The
  # integration suite exercises the FastAPI app end-to-end via ``TestClient``
  # (see ``tests/test_*_api.py``).
  test-integration:
    name: "🧪 Test (integration)"
    runs-on: ubuntu-latest
    needs: [test-unit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Run integration tests
        # No "|| [ $? -eq 5 ]" here: pytest exits with 5 when nothing was
        # collected, and that must fail the job. The guard used to turn "the
        # lane runs zero tests" into a green build.
        run: poetry run pytest -m integration -v
        env:
          # Nur ``DATABASE_URL`` — die Tests fallen über den
          # Conftest-Fallback automatisch darauf zurück, und es gibt
          # auf dem Runner sowieso nur diese eine DB. Pflichtfeld in
          # ``Settings``; ohne wäre der App-Import schon ein
          # ValidationError.
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          # Required — see test-unit job for the full rationale.
          # Without this, the FastAPI lifespan spawns a Celery
          # listener thread on every TestClient(app) enter, stacks
          # up over hundreds of tests, and either hangs the runner
          # or OOM-kills it.
          DISABLE_BACKGROUND_TASKS: "1"
          CREDENTIAL_ENCRYPTION_KEY: "Q1PNlFd4It9oQPtjCcXcmB7wGDkY4w8KwpIRNSF4u7U="
          KEYCLOAK_SERVER_URL: "http://localhost:8080"
          KEYCLOAK_REALM: "dhbw"
          KEYCLOAK_CLIENT_ID: "appstore-backend"
          KEYCLOAK_CLIENT_SECRET: "test-secret"
          KEYCLOAK_ENABLED: "false"
          COVERAGE_FILE: .coverage.integration

      - name: Upload coverage data (integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  # ================================================================
  # 📊 COVERAGE — aggregate + publish to GitHub Pages
  # ================================================================
  # Combines the .coverage data from the unit and integration jobs,
  # renders an HTML report, emits a Shields.io endpoint badge.json,
  # and (only on main) deploys everything to GitHub Pages.
  #
  # The Pages source for this repo is set to "GitHub Actions". Should
  # that ever be switched off again, the publish steps fail but no
  # longer redden the job — see the note beside them.
  coverage:
    name: "📊 Coverage"
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage data
        run: poetry run coverage combine

      - name: Render HTML report
        run: poetry run coverage html -d coverage-html

      - name: Render JSON report
        run: poetry run coverage json -o coverage-html/coverage.json

      - name: Generate Shields.io endpoint badge
        run: |
          PCT=$(python -c "import json; print(round(json.load(open('coverage-html/coverage.json'))['totals']['percent_covered'], 1))")
          COLOR=$(python -c "p=$PCT; print('brightgreen' if p>=80 else 'green' if p>=70 else 'yellow' if p>=50 else 'orange' if p>=30 else 'red')")
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > coverage-html/badge.json
          echo "Coverage: ${PCT}% (${COLOR})"

      - name: Upload HTML report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

      # Publishing the report must not decide whether the deploy runs.
      # `CD - Staging-Deploy anstossen` waits for `conclusion == 'success'`
      # on the whole workflow, so a red step here holds back a release that
      # is otherwise built, scanned and pushed. These three steps report,
      # they do not gate.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: coverage-html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4
        continue-on-error: true

  # ================================================================
  # 🔒 SECURITY (deps + filesystem) — blocks on HIGH/CRITICAL
  # ================================================================
  # Runs in parallel with lint/test-unit. Findings appear in the
  # GitHub Security tab via SARIF upload. Whitelist false positives
  # in `.trivyignore` (with a comment explaining why).
  security:
    name: "🔒 Security"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root

      - name: pip-audit (production deps, HIGH+)
        run: |
          # Audit ONLY the production dependency graph, not the installed
          # venv. `poetry install --no-root` also pulls in the dev group
          # (pre-commit → virtualenv, mypy, …) and this step then adds
          # pip-audit itself; auditing the venv would flag all of those,
          # none of which ship in the production image. Export the `main`
          # group to a requirements file and audit that instead, so the
          # step matches its name.
          #
          # Poetry 2.x unbundled `export`, so install the plugin first.
          poetry self add poetry-plugin-export
          poetry export --only main --without-hashes -f requirements.txt -o requirements-prod.txt
          # pip-audit runs from an isolated pipx-style install so it does
          # not pollute the audited set.
          python -m pip install --upgrade pip pip-audit
          # No exceptions: ecdsa (PYSEC-2026-1325) left the tree with
          # python-jose when JWT handling moved to PyJWT.
          pip-audit --strict -r requirements-prod.txt

      # Trivy fs runs twice on purpose:
      #   1. blocking gate — fails the job on HIGH/CRITICAL
      #   2. SARIF emit — uploads ALL findings (incl. ignored ones)
      #      to the Security tab so they remain visible
      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

      - name: Trivy filesystem scan (SARIF for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy fs results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ================================================================
  # 🐳 BUILD — always runs, proves Dockerfile works
  # ================================================================
  build:
    name: "🐳 Build"
    runs-on: ubuntu-latest
    needs: [lint, test-integration, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest = Produktion (main), develop = Staging. Nicht an
          # {{is_default_branch}} haengen: Standardbranch ist develop, und
          # Produktion zoege sonst den Staging-Stand.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # 🔒 IMAGE SCAN — Trivy CVE scan against the built image
  # ================================================================
  # Builds a single-platform amd64 image with --load so the local
  # Docker daemon can hand it to Trivy. The build cache is shared
  # with the multi-platform `build` job (cache-from: type=gha) so
  # this is mostly a thin layer on top.
  image-scan:
    name: "🔒 Image Scan"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image (amd64, --load)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: backend:scan
          cache-from: type=gha

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

      - name: Trivy image scan (SARIF for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy image results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ================================================================
  # 📦 PUSH — main (Produktion) und develop (Staging)
  # ================================================================
  push:
    name: "📦 Push"
    runs-on: ubuntu-latest
    needs: [build, image-scan]
    # Auch beim manuellen Lauf: der ist fuer "nach einem behobenen
    # Infrastrukturproblem" da - ohne Push zoege der folgende Staging-Deploy
    # wieder das alte Image.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest = Produktion (main), develop = Staging. Nicht an
          # {{is_default_branch}} haengen: Standardbranch ist develop, und
          # Produktion zoege sonst den Staging-Stand.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Hier endet diese Datei, aber nicht die Pipeline.
#
# Das Image liegt jetzt in GHCR. Ausgerollt wird es von
# trigger-staging-deploy.yml nebenan: der Workflow wartet das Ende dieses
# Laufs ab und stößt im deployment-Repository den Neuaufbau des Staging-Stacks
# an. Siehe deployment/docs/adr/0002 und 0003.
#
# Der Grund ist nicht Bequemlichkeit, sondern das Netz. Die OpenStack-API der
# DHBW ist von außen nicht erreichbar; gemessen von einem GitHub-Runner aus
# (öffentliche IP 145.132.101.182):
#
#   DNS newstack.dhbw.cloud -> 141.72.5.140   löst öffentlich auf
#   https://...:5000/v3     -> 000 TIMEOUT    Keystone
#   https://...:443/        -> 000 TIMEOUT    Horizon
#
# Der Name ist öffentlich, das Netz ist es nicht. GitHubs gehostete Runner
# können also grundsätzlich nicht ausrollen, unabhängig von Zugangsdaten.
#
# Deshalb läuft der Deploy auf einem self-hosted Runner im Campusnetz. Der
# Einwand dagegen galt und gilt: dieses Repository ist öffentlich, und ein
# self-hosted Runner daran gäbe jedem, der einen Fork-PR öffnet, eine
# Ausführungsumgebung mit OpenStack-Zugang.
#
# Genau deshalb hängt der Runner nicht hier. Er ist ausschließlich am
# deployment-Repository registriert, und kein Workflow darauf hat einen
# pull_request-Trigger. Dieses Repository schickt nur einen repository_dispatch
# dorthin — es kennt kein einziges Zugangsdatum zu OpenStack.
