name: CD - Staging-Deploy anstossen

# Schliesst die Luecke zwischen Merge und Staging: sobald die CI auf `main`
# durch ist und das neue Image in GHCR liegt, stoesst dieser Workflow im
# deployment-Repository den Neuaufbau des Stacks an.
#
# Warum der Umweg ueber das deployment-Repository: der Deploy braucht die
# OpenStack-API der DHBW, und die ist von ausserhalb des Campusnetzes nicht
# erreichbar. Er laeuft deshalb auf dem self-hosted Runner, und der haengt aus
# gutem Grund nur am deployment-Repository - dieses Repository hier ist
# oeffentlich, ein Runner daran waere eine Ausfuehrungsumgebung fuer jeden, der
# einen Fork-PR oeffnen kann.
#
# Dieser Job traegt KEINE Zugangsdaten zu OpenStack, keinen SSH-Schluessel und
# keine .env. Er kennt genau ein Token, und das darf nichts weiter als einen
# Workflow im deployment-Repository starten.

on:
  # Nicht `push`, sondern das Ende des CI-Laufs: erst wenn Backend CI/CD
  # erfolgreich war, existiert das Image, das der Deploy ziehen soll. Bei
  # `push` liefe der Deploy gegen das alte Image.
  workflow_run:
    workflows: ["Backend CI/CD"]
    types: [completed]
    branches: [main]

  # Von Hand, wenn ein Deploy ohne neuen Commit noetig ist.
  workflow_dispatch:

# Der Job braucht nichts von GitHub - er ruft nur nach draussen.
permissions: {}

# Zwei Merges kurz hintereinander sollen nicht zwei Deploys uebereinander
# starten. Der zweite wartet; abgebrochen wird nichts, weil ein laufender
# terraform apply nichts ist, das man auf halber Strecke stehen laesst.
concurrency:
  group: staging-deploy-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: "Deploy anstossen"
    # Nur bei gruener CI. Ohne diese Zeile liefe der Deploy auch nach einem
    # fehlgeschlagenen Lauf - workflow_run feuert bei jedem Ende, nicht nur
    # bei Erfolg.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Token pruefen
        env:
          TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Das Organisations-Secret CROSS_REPO_PAT fehlt oder ist fuer dieses Repository nicht freigegeben." >&2
            exit 1
          fi

      - name: Neuaufbau im deployment-Repository ausloesen
        env:
          TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message || 'manuell ausgeloest' }}
        run: |
          set -euo pipefail
          # --retry faengt die Faelle ab, in denen GitHub kurz klemmt.
          # Ausgegeben wird nur der Statuscode: die Antwort koennte sonst
          # Kopfzeilen ins oeffentliche Log tragen.
          payload=$(jq -nc             --arg repo "${{ github.repository }}"             --arg sha "$SHA"             --arg ref "${{ github.ref }}"             --arg msg "$(printf '%s' "$MESSAGE" | head -1)"             '{event_type:"trigger-deployment",client_payload:{repository:$repo,sha:$sha,ref:$ref,message:$msg}}')

          code=$(curl -sS -o /dev/null -w '%{http_code}'             --retry 3 --retry-connrefused --retry-delay 5 --max-time 30             -X POST             -H "Authorization: Bearer $TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -d "$payload"             https://api.github.com/repos/${{ github.repository_owner }}/deployment/dispatches)

          case "$code" in
            204) echo "Neuaufbau angestossen (HTTP 204)." ;;
            401|403) echo "::error::HTTP $code - CROSS_REPO_PAT ist abgelaufen oder hat keine Schreibrechte am deployment-Repository." >&2; exit 1 ;;
            404) echo "::error::HTTP 404 - Repository nicht gefunden, oder dem Token fehlt der repo-Scope." >&2; exit 1 ;;
            422) echo "::error::HTTP 422 - GitHub hat die Nutzlast abgelehnt." >&2; exit 1 ;;
            000) echo "::error::Keine Verbindung zu api.github.com." >&2; exit 1 ;;
            *) echo "::error::Unerwartete Antwort HTTP $code." >&2; exit 1 ;;
          esac

          echo "Der Lauf selbst steht unter https://github.com/${{ github.repository_owner }}/deployment/actions - dieser Job wartet nicht darauf."
